name: OpenStream quality and platform artifacts

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-native-core-and-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Test native OpenXR projection core
        run: |
          sh scripts/openxr-core-test.sh
          sh scripts/quest-layer-test.sh
      - name: Build television staging packages
        run: node scripts/build-tv-packages.mjs
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: openstream-web
          path: dist
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: openstream-smart-tv-staging
          path: dist/tv/artifacts/*
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK and pinned native toolchain
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools ndk;29.0.14206865 cmake;4.1.2'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.5.1
          # Default only saves caches on the default branch, which never runs
          # this workflow, so every PR build was starting cold.
          cache-read-only: false
      - name: Build Android mobile/tablet
        run: gradle --no-watch-fs -p native/android-xr testDebugUnitTest lintDebug assembleDebug
      - name: Build Google TV
        run: gradle --no-watch-fs -p native/google-tv testDebugUnitTest lintDebug assembleDebug
      - name: Build Android XR SceneCore
        run: OPENSTREAM_ANDROID_XR_BUILD_DIR="$RUNNER_TEMP/openstream-android-xr-scene" gradle --no-watch-fs -p native/android-xr-scene testDebugUnitTest lintDebug assembleDebug
      - name: Build Meta Quest OpenXR
        run: OPENSTREAM_QUEST_BUILD_DIR="$RUNNER_TEMP/openstream-meta-quest" gradle --no-watch-fs -p native/meta-quest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: openstream-android-debug
          path: native/android-xr/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: openstream-google-tv-debug
          path: native/google-tv/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: openstream-android-xr-debug
          path: ${{ runner.temp }}/openstream-android-xr-scene/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: openstream-meta-quest-debug
          path: ${{ runner.temp }}/openstream-meta-quest/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # macOS minutes bill at 10x and each job rounds up to a whole minute, so this
  # job alone was ~30 billable minutes per PR push. It now runs only on merges
  # to main and manual dispatch; trigger it from the Actions tab when Apple
  # code needs a check mid-PR.
  apple:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Test Apple shared core
        run: swift test --package-path native/apple --scratch-path /tmp/openstream-apple-build --jobs 1
      - name: Compile Apple platform apps
        run: |
          xcodebuild -project native/apple/Apps/OpenStreamApps.xcodeproj -target 'OpenStream iOS' -sdk iphonesimulator -configuration Debug SYMROOT=/tmp/openstream-ios-products OBJROOT=/tmp/openstream-ios-objects CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project native/apple/Apps/OpenStreamApps.xcodeproj -target 'OpenStream tvOS' -sdk appletvsimulator -configuration Debug SYMROOT=/tmp/openstream-tvos-products OBJROOT=/tmp/openstream-tvos-objects CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project native/apple/Apps/OpenStreamApps.xcodeproj -target 'OpenStream visionOS' -sdk xrsimulator -configuration Debug SYMROOT=/tmp/openstream-vision-products OBJROOT=/tmp/openstream-vision-objects CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: openstream-apple-simulator-apps
          path: |
            /tmp/openstream-ios-products/Debug-iphonesimulator/OpenStream iOS.app
            /tmp/openstream-tvos-products/Debug-appletvsimulator/OpenStream tvOS.app
            /tmp/openstream-vision-products/Debug-xrsimulator/OpenStream visionOS.app
          retention-days: 7
