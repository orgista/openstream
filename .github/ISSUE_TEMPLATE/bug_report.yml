name: Bug report
description: Report something that does not work.
body:
  - type: input
    id: version
    attributes:
      label: App version and build
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use media you own or have permission to share.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove credentials, private server URLs and personal paths before posting.
